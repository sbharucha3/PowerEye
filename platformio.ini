; PowerEye firmware (PlatformIO). One env per program:
;   pio run -e node_standalone -t upload   ADC -> OLED + LEDs, no radio (known-good fallback)
;   pio run -e lora_star -t upload         hub AND node firmware (role is set over serial, see src/lora_star/README.md)
;   pio run -e adc_demo / peripherals_check   bench tools

[platformio]
src_dir = src
lib_dir = lib

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = olikraus/U8g2

[env:node_standalone]
build_src_filter = -<*> +<node_standalone/>

[env:lora_star]
build_src_filter = -<*> +<lora_star/main.cpp>
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@^7.1.0

[env:adc_demo]
build_src_filter = -<*> +<bringup/adc_demo/>

[env:peripherals_check]
build_src_filter = -<*> +<bringup/peripherals_check/>
